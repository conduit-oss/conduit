id: discord-llm-pinecone
smoke: true
failure_kind: resource-to-client-call-shape
description: >
  pinecone 2.2.1 → 3.2.2 on eugeneyan/discord-llm. qa.py calls the v2
  module-level API `pinecone.init(api_key=..., environment=...)` twice and
  constructs `pinecone.Index(...)`. On 3.2.2 those names are raise-only
  *args/**kwargs stubs in pinecone/deprecation_warnings.py (AttributeError
  pointing at the Pinecone client). The replacement is a `Pinecone(api_key=...)`
  client and `pc.Index(...)`.
repo:
  url: https://github.com/eugeneyan/discord-llm
  commit: 0308a50b89e432bd7e34656e9b3911939eab7e9f
dependency:
  name: pinecone
  from: "2.2.1"
  to: "3.2.2"
timeout_seconds: 900
expected:
  must_fix:
    - path: qa.py
      contains: "pinecone.init("
    - path: qa.py
      contains: "pinecone.Index("
  forbidden_names:
    - "pinecone.init"
  required_patterns:
    - "Pinecone\\("
  untouched_globs:
    - "tests/**"
    - "**/test_*.py"
  notes: >
    Labeled from the pinned tree and requirements (pinecone-client==2.2.1).
    pinecone 3.2.2 keeps init as a raise-only stub; impact must report removed
    (not param_removed) so client-move can fire. No model run.
