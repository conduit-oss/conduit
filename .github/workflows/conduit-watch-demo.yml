name: Conduit Watch Demo

on:
  push:
    branches: [main, "stack/**"]
  pull_request:
  workflow_dispatch:

jobs:
  watch-dirty-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Conduit
        run: pip install -e "./conduit[langs,dev]"
      - name: Ephemeral bump-dirty fixture must fail Watch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["FIXTURE"])
          (root / "src").mkdir(parents=True, exist_ok=True)
          (root / "src" / "ai_client.py").write_text(
              'import openai\n\n'
              'DEFAULT_MODEL = "gpt-4-0613"\n\n'
              'def complete(prompt: str, model: str = DEFAULT_MODEL) -> str:\n'
              '    response = openai.ChatCompletion.create(\n'
              '        model=model,\n'
              '        messages=[{"role": "user", "content": prompt}],\n'
              '        max_tokens=64,\n'
              '    )\n'
              '    return response["choices"][0]["message"]["content"] or ""\n',
              encoding="utf-8",
          )
          (root / "requirements.txt").write_text("openai==1.0.0\n", encoding="utf-8")
          PY
          set +e
          conduit watch --path "$FIXTURE" --packet ./examples/sample-packet/conduit-packet.json
          code=$?
          set -e
          test "$code" -ne 0
        env:
          FIXTURE: ${{ runner.temp }}/watch-dirty

  watch-pin-past-dirty-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Conduit
        run: pip install -e "./conduit[langs,dev]"
      - name: Pin past to_version with leftovers must fail Watch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["FIXTURE"])
          (root / "src").mkdir(parents=True, exist_ok=True)
          (root / "src" / "ai_client.py").write_text(
              'import openai\n\n'
              'DEFAULT_MODEL = "gpt-4-0613"\n\n'
              'def complete(prompt: str, model: str = DEFAULT_MODEL) -> str:\n'
              '    response = openai.ChatCompletion.create(\n'
              '        model=model,\n'
              '        messages=[{"role": "user", "content": prompt}],\n'
              '        max_tokens=64,\n'
              '    )\n'
              '    return response["choices"][0]["message"]["content"] or ""\n',
              encoding="utf-8",
          )
          (root / "requirements.txt").write_text("openai==1.5.0\n", encoding="utf-8")
          PY
          set +e
          conduit watch --path "$FIXTURE" --packet ./examples/sample-packet/conduit-packet.json
          code=$?
          set -e
          test "$code" -ne 0
        env:
          FIXTURE: ${{ runner.temp }}/watch-pin-past-dirty

  watch-clean-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Conduit
        run: pip install -e "./conduit[langs,dev]"
      - name: Ephemeral clean fixture must pass Watch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["FIXTURE"])
          (root / "src").mkdir(parents=True, exist_ok=True)
          (root / "src" / "ai_client.py").write_text(
              'from openai import OpenAI\n\n'
              'client = OpenAI()\n'
              'DEFAULT_MODEL = "gpt-4o"\n\n'
              'def complete(prompt: str, model: str = DEFAULT_MODEL) -> str:\n'
              '    response = client.chat.completions.create(\n'
              '        model=model,\n'
              '        messages=[{"role": "user", "content": prompt}],\n'
              '        max_completion_tokens=64,\n'
              '    )\n'
              '    return response.choices[0].message.content or ""\n',
              encoding="utf-8",
          )
          (root / "requirements.txt").write_text("openai==1.0.0\n", encoding="utf-8")
          PY
          conduit watch --path "$FIXTURE" --packet ./examples/sample-packet/conduit-packet.json
        env:
          FIXTURE: ${{ runner.temp }}/watch-clean

  pydantic-watch-dirty-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Conduit
        run: pip install -e "./conduit[langs,dev]"
      - name: Pydantic fixture at to_version with leftover must fail Watch
        run: |
          set -euo pipefail
          FIXTURE="${{ runner.temp }}/pydantic-dirty"
          cp -a ./examples/pydantic-validator-fixture "$FIXTURE"
          printf 'pydantic==2.0.0\n' > "$FIXTURE/requirements.txt"
          set +e
          conduit watch --path "$FIXTURE" --packet ./examples/sample-packet/pydantic-validator-hop.json
          code=$?
          set -e
          test "$code" -ne 0

  pydantic-watch-clean-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Conduit
        run: pip install -e "./conduit[langs,dev]"
      - name: Pydantic watch-apply-watch exits 1 then 0 then 0
        run: |
          set -euo pipefail
          FIXTURE="${{ runner.temp }}/pydantic-cli"
          PACKET=./examples/sample-packet/pydantic-validator-hop.json
          cp -a ./examples/pydantic-validator-fixture "$FIXTURE"
          printf 'pydantic==2.0.0\n' > "$FIXTURE/requirements.txt"
          set +e
          conduit watch --path "$FIXTURE" --packet "$PACKET"
          dirty=$?
          set -e
          test "$dirty" -eq 1
          conduit apply --path "$FIXTURE" --packet "$PACKET"
          conduit watch --path "$FIXTURE" --packet "$PACKET"

  pydantic-hand-enriched-apply-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Conduit
        run: pip install -e "./conduit[langs,dev]"
      - name: Hand-enriched packet apply then Watch covers validator and Config
        run: |
          set -euo pipefail
          FIXTURE="${{ runner.temp }}/pydantic-hand-enriched"
          PACKET=./examples/sample-packet/pydantic-llm-mint-live-hand-enriched.json
          cp -a ./examples/pydantic-validator-fixture "$FIXTURE"
          conduit apply --path "$FIXTURE" --packet "$PACKET"
          conduit watch --path "$FIXTURE" --packet "$PACKET" --json
          python - <<'PY'
          from pathlib import Path
          import os
          text = (Path(os.environ["FIXTURE"]) / "src" / "model.py").read_text(encoding="utf-8")
          assert '@field_validator("name")' in text
          assert "field_field_validator" not in text
          assert "class Config" not in text
          assert "model_config = ConfigDict(from_attributes=True)" in text
          assert "self.model_dump()" in text
          PY
        env:
          FIXTURE: ${{ runner.temp }}/pydantic-hand-enriched
