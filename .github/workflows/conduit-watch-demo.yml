name: Conduit Watch Demo

on:
  push:
    branches: [main, "stack/**"]
  pull_request:
  workflow_dispatch:

jobs:
  map-and-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Conduit
        run: pip install -e "./conduit[dev]"
      - name: Map a wrapped client and watch recorded feeds
        run: |
          set -euo pipefail
          conduit map --path ./examples/wrapped-openai-fixture --json > /tmp/map.json
          python - << 'PY'
          import json
          payload = json.load(open("/tmp/map.json"))
          assert payload.get("chains") or payload.get("services"), payload
          PY
          conduit watch --path ./examples/wrapped-openai-fixture --feeds ./conduit/fixtures/feeds --json > /tmp/watch.json
          python - << 'PY'
          import json
          payload = json.load(open("/tmp/watch.json"))
          assert payload.get("packets"), payload
          PY
