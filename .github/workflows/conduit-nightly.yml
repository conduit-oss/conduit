name: Conduit Nightly Lag Scan

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Conduit
        run: pip install -e "./conduit[llm,langs,dev]"
      - name: Nightly detect + migrate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          conduit run --path . --skip-lockfile --module openai --no-push || true
          # Prefer consumer repos to point this workflow at their app path.
          # In this monorepo, prove the structural 0.28 kill-bar hop (skip demo
          # suite assertions that intentionally encode the legacy surface):
          conduit run --path ./examples/demo-consumer --packet ./examples/sample-packet/conduit-packet.json --demo --skip-tests --skip-pr
          git -C examples/demo-consumer checkout -- .
