name: Conduit CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e "./conduit[dev,llm,langs]"
          pip install pytest
      - name: Unit tests
        env:
          # Authenticated GitHub API (5k/hr) for live OpenAPI commit-by-date
          # resolution; without this, unauthenticated 60/hr is exhausted mid-suite.
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m pytest -q conduit/tests
      - name: Offline demo rewrite
        run: |
          python -c "from pathlib import Path; from conduit.main import apply_migration; apply_migration(Path('examples/demo-consumer'), 'examples/sample-packet/conduit-packet.json', dry_run=True)"
