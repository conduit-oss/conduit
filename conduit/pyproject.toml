[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit"
version = "0.3.0"
description = "Autonomous CLI for breaking API migrations via detect modules and Migration Packets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.0",
  "libcst>=1.4",
  "pathspec>=0.12",
  "jsonschema>=4.22",
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "packaging>=24.0",
  "pyyaml>=6.0",
  "tomlkit>=0.13",
]

[project.optional-dependencies]
llm = ["openai>=1.30", "ddgs>=9.0"]
llm-anthropic = ["anthropic>=0.34", "ddgs>=9.0"]
llm-js = [
  "tree-sitter>=0.21",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-typescript>=0.21",
]
langs = [
  "tree-sitter>=0.21",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-typescript>=0.21",
  "tree-sitter-java>=0.21",
  "tree-sitter-go>=0.21",
]
llm-all = [
  "openai>=1.30",
  "anthropic>=0.34",
  "ddgs>=9.0",
  "tree-sitter>=0.21",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-typescript>=0.21",
  "tree-sitter-java>=0.21",
  "tree-sitter-go>=0.21",
]
dev = ["pytest>=8.0"]

[project.scripts]
conduit = "conduit.main:app"

[project.entry-points."conduit.detect_modules"]
openai = "conduit.detect.modules.openai:OpenAIModule"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conduit = ["py.typed"]

[tool.setuptools]
include-package-data = true
