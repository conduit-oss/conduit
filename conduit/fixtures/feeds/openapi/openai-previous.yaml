openapi: 3.0.3
info:
  title: Recorded OpenAI spec (previous)
  version: "0.28.1"
paths:
  /v1/models:
    get:
      operationId: listModels
      summary: List models
      responses:
        "200":
          description: OK
  /v1/completions:
    post:
      operationId: createCompletion
      summary: Create a completion
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                max_tokens:
                  type: integer
      responses:
        "200":
          description: OK
  /v1/engines/{engine_id}:
    delete:
      operationId: deleteEngine
      summary: Delete an engine
      responses:
        "200":
          description: OK
