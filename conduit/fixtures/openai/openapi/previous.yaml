openapi: 3.0.0
info:
  title: OpenAI API (previous)
  version: "1.0.0"
paths:
  /v1/engines:
    get:
      operationId: listEngines
      summary: Lists the currently available engines
      responses:
        "200":
          description: OK
  /v1/completions:
    post:
      operationId: createCompletion
      summary: Creates a completion for the provided prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                max_tokens:
                  type: integer
                messages:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: OK
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Creates a model response for the given chat conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                max_tokens:
                  type: integer
                messages:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: OK
